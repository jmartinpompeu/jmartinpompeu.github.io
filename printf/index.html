    // Calculos

    Tfinal1 = (-vo + sqrt(vo*vo - 4*gm*yo)) / (2*gm);
    Tfinal2 = (-vo - sqrt(vo*vo - 4*gm*yo)) / (2*gm);

    Vfinal1 = vo + g*Tfinal1;
    Vfinal2 = vo + g*Tfinal2;

    printf("a) Quant de temps tarda en arribar a l'aigua? %.2f s\n", Tfinal2);

    const status = document.getElementById("status");

    let clang = null;


    // 4. CANVIAR MISSATGE D'ESTAT

    function setStatus(message) {
      status.textContent = message;
    }


    // 5. COMPROVAR AILLAMENT

    function checkIsolation() {
      return window.crossOriginIsolated &&
        typeof SharedArrayBuffer !== "undefined";
    }


    // 6. DESCARREGAR FITXERS

    function downloadFile(data, filename, type) {

      const blob = new Blob([data], { type });

      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");

      link.href = url;
      link.download = filename;
      link.textContent = "Descarregar " + filename;
      link.className = "download";

      downloads.appendChild(link);
      downloads.appendChild(document.createElement("br"));
    }


    // 7. PREPARAR COMPILADOR

    async function initialize() {

      if (initialized) return;

      if (!checkIsolation()) {
        throw new Error(
          "El navegador no esta aillat.\n" +
          "Comprova coi-serviceworker.js i recarrega la pagina."
        );
      }

      setStatus("Inicialitzant WebAssembly...");

      await init();

      setStatus("Descarregant Clang (primera vegada pot trigar)...");

      clang = await Wasmer.fromRegistry("clang/clang");
